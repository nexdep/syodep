name: CI

on:
  pull_request:
  push:
    branches:
      - "**"
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-lint:
    name: Rust formatting and clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # clippy --all-targets compiles native deps (MuPDF, font discovery),
      # which need the fontconfig headers just like the test job.
      - name: Build dependencies for MuPDF
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # makensis is cross-platform, so the Windows installer script is
      # syntax-checked here in ~1 minute rather than only in the 12-minute
      # Windows release build. -WX makes warnings (e.g. a section referenced
      # before it is defined) fail the job.
      - name: Install NSIS and ImageMagick
        run: sudo apt-get install -y nsis imagemagick
      - name: Compile the installer script
        run: |
          mkdir -p /tmp/stub/platforms
          touch /tmp/stub/syodep.exe /tmp/stub/Qt6Core.dll \
                /tmp/stub/platforms/qwindows.dll
          # A real icon, not a touched empty file: MUI_ICON points at this and
          # makensis aborts with a double-free rather than a clean error when
          # handed an invalid .ico. Generating it here also means this job
          # fails if packaging/syodep.svg stops rendering.
          #
          # Ubuntu's imagemagick package is ImageMagick 6, whose command is
          # `convert`; `magick` only exists in 7. Accept either, as
          # ui-qt/CMakeLists.txt already does.
          magick_bin="$(command -v magick || command -v convert)"
          "$magick_bin" -background none packaging/syodep.svg \
            -define icon:auto-resize=256,128,64,48,32,24,16 /tmp/stub/syodep.ico
          makensis -WX -V2 \
            -DVERSION=0.0.0-citest -DVERSION_NUMERIC=0.0.0.0 \
            -DSRCDIR=/tmp/stub -DLICENSE_FILE="$PWD/LICENSE" \
            -DOUTFILE=/tmp/syodep-setup.exe \
            packaging/syodep.nsi
          test -s /tmp/syodep-setup.exe

  rust-test-linux:
    name: Rust tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build dependencies for MuPDF
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      # Covers config parsing, keymap/input, layout, storage/migrations,
      # PDF open/render/text extraction and the FFI surface.
      - name: cargo test
        run: cargo test --workspace

  rust-test-windows:
    name: Rust tests (Windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --workspace

  qt-build-linux:
    name: Qt shell build + smoke test (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Qt and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build qt6-base-dev \
            libqt6opengl6-dev libgl1-mesa-dev libfontconfig1-dev \
            libfreetype-dev xvfb
      - name: Configure
        run: cmake -B build -G Ninja
      - name: Build
        run: cmake --build build
      - name: Smoke test (open + render a PDF offscreen)
        run: |
          cargo run -p syodep-pdf --features test-support \
            --example make_fixture -- fixture.pdf 5
          # xvfb gives a real X display so QOpenGLWidget/QTextEdit painting is
          # less brittle than QT_QPA_PLATFORM=offscreen on the runner's Qt 6.4.
          xvfb-run -a ./build/ui-qt/syodep --smoke-test fixture.pdf \
            || { echo '--- smoke-progress.txt ---'; cat smoke-progress.txt 2>/dev/null || true; exit 1; }

  qt-build-windows:
    name: Qt shell build + smoke test (Windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.3"
          arch: win64_msvc2019_64
          cache: true
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
      # Built before CMake so a Rust-side failure is distinguishable from a
      # C++ shell failure in the job overview.
      - name: Build Rust core
        run: cargo build -p syodep-ffi --release
      # Release is required on Windows: the default (debug) C++ config links
      # debug Qt libs and /MDd, which conflicts with MuPDF's /MD objects.
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      # On failure the log tail goes to the job summary for quick triage.
      - name: Build
        shell: pwsh
        run: |
          cmake --build build 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            "## Windows shell build failure (tail)" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            '~~~' | Out-File -Append $env:GITHUB_STEP_SUMMARY
            Get-Content build.log -Tail 100 | Out-File -Append $env:GITHUB_STEP_SUMMARY
            '~~~' | Out-File -Append $env:GITHUB_STEP_SUMMARY
            exit 1
          }
      # The exe is a GUI-subsystem binary (WIN32_EXECUTABLE): stdout is
      # invisible, so the smoke test is judged by its exit code only.
      - name: Smoke test (open + render a PDF offscreen)
        shell: pwsh
        run: |
          cargo run -p syodep-pdf --features test-support `
            --example make_fixture -- fixture.pdf 5
          $env:QT_QPA_PLATFORM = "offscreen"
          $exe = (Resolve-Path "build/ui-qt/syodep.exe").Path
          $pdf = (Resolve-Path "fixture.pdf").Path
          $proc = Start-Process -FilePath $exe `
            -ArgumentList "--smoke-test", $pdf `
            -WorkingDirectory (Get-Location).Path -PassThru -Wait
          if ($proc.ExitCode -ne 0) {
            if (Test-Path smoke-progress.txt) {
              Write-Host "--- smoke-progress.txt ---"
              Get-Content smoke-progress.txt
            }
            Write-Error "smoke test failed with exit code $($proc.ExitCode)"
            exit 1
          }

  docs:
    name: Documentation checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Required docs exist and commands/config are documented
        run: ./scripts/check-docs.sh

  build-artifact:
    name: Build push artifact
    runs-on: ubuntu-24.04
    needs:
      - rust-lint
      - rust-test-linux
      - rust-test-windows
      - qt-build-linux
      - qt-build-windows
      - docs
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Qt and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build qt6-base-dev \
            libqt6opengl6-dev libgl1-mesa-dev libfontconfig1-dev \
            libfreetype-dev xvfb
      - name: Build release artifact
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          cargo run -p syodep-pdf --features test-support \
            --example make_fixture -- fixture.pdf 5
          xvfb-run -a ./build/ui-qt/syodep --smoke-test fixture.pdf \
            || { echo '--- smoke-progress.txt ---'; cat smoke-progress.txt 2>/dev/null || true; exit 1; }
      - name: Package artifact
        run: |
          mkdir -p dist/package
          install -m 755 build/ui-qt/syodep dist/package/syodep
          {
            echo "ref=${GITHUB_REF_NAME}"
            echo "sha=${GITHUB_SHA}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > dist/package/version.txt
          tar -C dist/package -czf "dist/syodep-linux-x86_64-${GITHUB_SHA::12}.tar.gz" .
          cd dist
          sha256sum "syodep-linux-x86_64-${GITHUB_SHA::12}.tar.gz" > "syodep-linux-x86_64-${GITHUB_SHA::12}.tar.gz.sha256"
      - name: Upload push artifact
        uses: actions/upload-artifact@v4
        with:
          name: syodep-linux-x86_64-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
