# Release pipeline.
#
# Final shape (documented in docs/packaging.md):
#   - tag push `v*` triggers a versioned release
#   - push to `main` updates the rolling `continuous` prerelease
#   - Linux: build in an ubuntu:22.04 container (glibc 2.35 floor) with
#     distro Qt, bundle as AppImage via linuxdeploy (implemented below)
#   - Windows: build with aqtinstall Qt, produce a portable zip
#     (implemented below) and an NSIS installer (planned)
#   - tag pushes publish the artifacts to a GitHub release (implemented);
#     workflow_dispatch runs only build and upload workflow artifacts

name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release-build-linux:
    name: Release build (Linux AppImage)
    runs-on: ubuntu-24.04
    # Old userland on purpose: the AppImage inherits the build machine's
    # glibc floor (22.04 = 2.35), so it runs on Ubuntu 22.04+, Debian 12+,
    # Fedora 36+ etc. Qt comes from the container's apt and gets bundled.
    container: ubuntu:22.04
    steps:
      - uses: actions/checkout@v5
      # `unzip` is needed by MuPDF's build: its Makefile runs
      # docx_template_build.py when python3 is present (skipping it only when
      # python3 is *missing*), and that script shells out to unzip to unpack an
      # ODT template. python3 is not requested here but arrives transitively
      # through the recommends chain of these packages, so the unzip dependency
      # is invisible until it fires. Pull it in explicitly rather than relying
      # on apt recommends staying as they are.
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential clang libclang-dev cmake ninja-build \
            qt6-base-dev libqt6opengl6-dev qt6-wayland libgl1-mesa-dev \
            libfontconfig1-dev libfreetype-dev \
            curl file ca-certificates unzip
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build (release)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      # linuxdeploy bundles the binary, Qt libs and platform plugins into
      # an AppDir; system-integration libs (glibc, libGL, fontconfig) stay
      # on its exclude list and resolve from the host at runtime.
      # --appimage-extract-and-run because containers have no FUSE.
      - name: Package AppImage (linuxdeploy)
        run: |
          curl -fsSLO https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSLO https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage
          # Bundle native Wayland support plus offscreen for the smoke test
          # below (and headless use generally). linuxdeploy-plugin-qt
          # deploys libqxcb.so by default.
          export EXTRA_PLATFORM_PLUGINS="libqoffscreen.so;libqwayland-egl.so;libqwayland-generic.so"
          export QMAKE=/usr/bin/qmake6
          export APPIMAGE_EXTRACT_AND_RUN=1
          export OUTPUT="syodep-x86_64.AppImage"
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --executable build/ui-qt/syodep \
            --desktop-file packaging/syodep.desktop \
            --icon-file packaging/syodep.svg \
            --plugin qt \
            --output appimage
      - name: Verify bundled Qt platform plugins
        run: |
          chmod +x syodep-x86_64.AppImage
          ./syodep-x86_64.AppImage --appimage-extract
          platform_dir="$(find squashfs-root -type d -path '*/plugins/platforms' -print -quit)"
          test -n "$platform_dir"
          test -f "$platform_dir/libqxcb.so"
          test -f "$platform_dir/libqoffscreen.so"
          test -f "$platform_dir/libqwayland-egl.so"
          test -f "$platform_dir/libqwayland-generic.so"
      # Run the actual AppImage so a missing bundled lib fails here, not
      # on a user's machine (mirrors the Windows staged smoke test).
      - name: Smoke test the AppImage
        run: |
          cargo run -p syodep-pdf --features test-support \
            --example make_fixture -- fixture.pdf 5
          chmod +x syodep-x86_64.AppImage
          QT_QPA_PLATFORM=offscreen ./syodep-x86_64.AppImage \
            --appimage-extract-and-run --smoke-test fixture.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: syodep-x86_64-appimage
          path: syodep-x86_64.AppImage

  release-build-windows:
    name: Release build (Windows portable zip)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.3"
          arch: win64_msvc2019_64
          cache: true
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build (release)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Stage portable tree (windeployqt)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path syodep-win64 | Out-Null
          Copy-Item build/ui-qt/syodep.exe syodep-win64/
          windeployqt --release --no-translations syodep-win64/syodep.exe
          Copy-Item LICENSE, README.md syodep-win64/
          Copy-Item config/default-config.toml syodep-win64/
          # Generated by the Qt build from packaging/syodep.svg. Shipped so
          # shortcuts have something to point at; the exe embeds it too.
          Copy-Item build/ui-qt/syodep.ico syodep-win64/
      # A failed SVG render still yields a structurally valid .ico, so check
      # the frames exist and the largest one is not blank.
      - name: Verify the generated icon
        shell: pwsh
        run: |
          $frames = @(magick identify syodep-win64/syodep.ico).Count
          if ($frames -lt 7) { throw "syodep.ico has $frames frames, expected 7" }
          $sd = magick syodep-win64/syodep.ico[0] -format "%[fx:standard_deviation]" info:
          if ([double]$sd -lt 0.05) { throw "syodep.ico looks blank (sd=$sd)" }
          Write-Host "syodep.ico: $frames frames, sd=$sd"
      # Run the smoke test from the staged tree with Qt stripped from PATH,
      # so a missing bundled DLL fails here instead of on a user's machine.
      # GUI-subsystem exe: judged by exit code only.
      - name: Smoke test staged binary
        shell: pwsh
        run: |
          cargo run -p syodep-pdf --features test-support `
            --example make_fixture -- fixture.pdf 5
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notlike '*Qt*' }) -join ';'
          $env:QT_QPA_PLATFORM = "offscreen"
          $proc = Start-Process -FilePath "syodep-win64/syodep.exe" `
            -ArgumentList "--smoke-test", "fixture.pdf" -PassThru -Wait
          if ($proc.ExitCode -ne 0) {
            Write-Error "staged smoke test failed with exit code $($proc.ExitCode)"
            exit 1
          }
      - name: Zip portable tree
        shell: pwsh
        run: Compress-Archive -Path syodep-win64 -DestinationPath syodep-win64.zip
      # NSIS 3.10 is preinstalled on windows-2022. The script is already
      # syntax-checked on Linux by the CI lint job; this builds it for real
      # over the tree the smoke test above just validated.
      - name: Build installer (NSIS)
        shell: pwsh
        run: |
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $ver = $env:GITHUB_REF_NAME -replace '^v',''
            # A tag that disagrees with Cargo.toml would ship an installer and a
            # Scoop manifest asserting a version the binary does not report.
            if ($ver -ne $cargo) {
              throw "tag $env:GITHUB_REF_NAME does not match Cargo.toml version $cargo"
            }
          } else {
            $ver = "$cargo-continuous"
          }
          # VIProductVersion accepts exactly four numeric components.
          $vernum = ($ver -replace '-.*','') + '.0'
          Write-Host "building installer for $ver ($vernum)"
          # NSIS's license control expects CRLF; convert a build-only copy so
          # the staged LICENSE (and the zip's hash) stay untouched.
          (Get-Content LICENSE -Raw) -replace "`r?`n", "`r`n" |
            Set-Content -NoNewline license-crlf.txt
          # Every path handed to makensis must be absolute: NSIS resolves
          # relative paths against the *script's* directory, so -DSRCDIR=x
          # would be looked up under packaging/x.
          makensis -WX -V3 "-DVERSION=$ver" "-DVERSION_NUMERIC=$vernum" `
            "-DSRCDIR=$PWD\syodep-win64" "-DLICENSE_FILE=$PWD\license-crlf.txt" `
            "-DOUTFILE=$PWD\syodep-setup.exe" packaging\syodep.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed" }
          "SYODEP_INSTALLER_VERSION=$ver" | Out-File -Append $env:GITHUB_ENV
      # Install it, run the installed binary, uninstall it. Anything less is a
      # compile check, not a gate.
      - name: Verify the installer end to end
        shell: pwsh
        run: |
          $dst = "$env:LOCALAPPDATA\Programs\syodep-citest"
          $fixture = "$PWD\fixture.pdf"

          # --- silent install; /D= must be last, unquoted, no trailing slash
          $p = Start-Process .\syodep-setup.exe -ArgumentList "/S","/D=$dst" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "silent install exited $($p.ExitCode)" }
          foreach ($f in "syodep.exe","Uninstall.exe","syodep.ico","LICENSE") {
            if (-not (Test-Path "$dst\$f")) { throw "installed tree is missing $f" }
          }
          if (-not (Test-Path "$dst\platforms\qwindows.dll")) { throw "no Qt platform plugin" }

          # --- Add/Remove Programs entry
          $k = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\syodep"
          $arp = Get-ItemProperty $k -ErrorAction Stop
          if ($arp.DisplayVersion -ne $env:SYODEP_INSTALLER_VERSION) {
            throw "DisplayVersion=$($arp.DisplayVersion), expected $env:SYODEP_INSTALLER_VERSION"
          }
          if (-not $arp.QuietUninstallString) { throw "QuietUninstallString missing" }
          # KiB, not bytes: a unit slip here reports ~1.5 GB for a 60 MB app.
          if ($arp.EstimatedSize -lt 20000 -or $arp.EstimatedSize -gt 500000) {
            throw "EstimatedSize $($arp.EstimatedSize) KiB is implausible"
          }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\syodep.lnk")) {
            throw "Start-menu shortcut missing"
          }

          # --- "Open with" is unconditional; the association is opt-in and
          #     must NOT have happened under a plain /S.
          if (-not (Test-Path "HKCU:\Software\Classes\Applications\syodep.exe\shell\open\command")) {
            throw "Open-With registration missing"
          }
          $owp = Get-ItemProperty "HKCU:\Software\Classes\.pdf\OpenWithProgids" -ErrorAction SilentlyContinue
          if ($owp -and $owp.PSObject.Properties.Name -contains 'syodep.pdf') {
            throw "/S associated .pdf without /ASSOCIATE"
          }

          # --- run what was installed, with Qt stripped from PATH
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notlike '*Qt*' }) -join ';'
          $env:QT_QPA_PLATFORM = 'offscreen'
          $p = Start-Process "$dst\syodep.exe" -ArgumentList "--smoke-test",$fixture -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installed binary smoke test exited $($p.ExitCode)" }

          # --- user data must survive uninstall. --smoke-test runs without
          #     persistence, so plant a sentinel or this assertion is vacuous.
          New-Item -ItemType Directory -Force "$env:APPDATA\syodep" | Out-Null
          Set-Content "$env:APPDATA\syodep\sentinel.txt" "keep me"

          # --- _?= keeps the uninstaller in place instead of relaunching from
          #     %TEMP% and returning immediately, which would race every
          #     assertion below. It must be the last argument.
          $p = Start-Process "$dst\Uninstall.exe" -ArgumentList "/S","_?=$dst" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "silent uninstall exited $($p.ExitCode)" }
          if (Test-Path "$dst\syodep.exe") { throw "payload survived uninstall" }
          if (Test-Path "$dst\platforms") { throw "Qt plugins survived uninstall" }
          if (Test-Path $k) { throw "ARP key survived uninstall" }
          if (Test-Path "HKCU:\Software\Classes\Applications\syodep.exe") {
            throw "Open-With registration survived uninstall"
          }
          if (-not (Test-Path "$env:APPDATA\syodep\sentinel.txt")) {
            throw "uninstall deleted user data it does not own"
          }
          Remove-Item -Recurse -Force $dst -ErrorAction SilentlyContinue

          # --- opt-in association really opts in
          $p = Start-Process .\syodep-setup.exe -ArgumentList "/S","/ASSOCIATE","/D=$dst" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "install with /ASSOCIATE exited $($p.ExitCode)" }
          $owp = Get-ItemProperty "HKCU:\Software\Classes\.pdf\OpenWithProgids"
          if ($owp.PSObject.Properties.Name -notcontains 'syodep.pdf') {
            throw "/ASSOCIATE did not register the ProgID"
          }
          Start-Process "$dst\Uninstall.exe" -ArgumentList "/S","_?=$dst" -Wait
          Remove-Item -Recurse -Force $dst -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$env:APPDATA\syodep" -ErrorAction SilentlyContinue

          # --- negative test: without this, SetErrorLevel is unproven and every
          #     assertion above rests on an installer that may always exit 0.
          #
          #     The target must be unwritable regardless of privilege. A system
          #     directory is not: CI runs elevated, so C:\Windows\System32 is
          #     writable here and the install legitimately succeeded. Putting a
          #     *file* where a parent directory is required fails for everyone.
          $blocker = "$PWD\blocker"
          Set-Content $blocker "not a directory"
          $p = Start-Process .\syodep-setup.exe `
            -ArgumentList "/S","/D=$blocker\syodep" -Wait -PassThru
          # Assert the outcome as well as the code: "installed nothing" is the
          # property that actually matters, and it holds regardless of how NSIS
          # chooses to report failure.
          if (Test-Path "$blocker\syodep\syodep.exe") {
            throw "installer wrote a payload into an unwritable path"
          }
          if ($p.ExitCode -eq 0) {
            $made = Test-Path "$blocker\syodep"
            throw ("silent install into an unwritable path exited 0. " +
                   "dir created=$made -- a failed /S install is " +
                   "indistinguishable from a successful one")
          }
          Write-Host "unwritable-path install correctly exited $($p.ExitCode)"
          Remove-Item $blocker -Force
      - uses: actions/upload-artifact@v4
        with:
          name: syodep-win64
          path: |
            syodep-win64.zip
            syodep-setup.exe
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    # Only tag pushes publish; manual dispatches stop at workflow artifacts.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-build-windows, release-build-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # main, not the tag: the Scoop manifest bump below is committed there.
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: syodep-win64
      - uses: actions/download-artifact@v4
        with:
          name: syodep-x86_64-appimage
      - name: Create release with versioned assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv syodep-win64.zip "syodep-${GITHUB_REF_NAME}-win64.zip"
          mv syodep-setup.exe "syodep-${GITHUB_REF_NAME}-win64-setup.exe"
          mv syodep-x86_64.AppImage "syodep-${GITHUB_REF_NAME}-x86_64.AppImage"
          gh release create "$GITHUB_REF_NAME" \
            "syodep-${GITHUB_REF_NAME}-win64.zip" \
            "syodep-${GITHUB_REF_NAME}-win64-setup.exe" \
            "syodep-${GITHUB_REF_NAME}-x86_64.AppImage" \
            --repo "$GITHUB_REPOSITORY" \
            --title "syodep $GITHUB_REF_NAME" \
            --generate-notes
      # Keep `scoop install/update syodep` pointing at the new asset.
      - name: Bump Scoop manifest
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          HASH=$(sha256sum "syodep-${GITHUB_REF_NAME}-win64.zip" | cut -d' ' -f1)
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/syodep-${GITHUB_REF_NAME}-win64.zip"
          jq --indent 4 --arg v "$VERSION" --arg h "$HASH" --arg u "$URL" \
            '.version = $v
             | .architecture."64bit".url = $u
             | .architecture."64bit".hash = $h' \
            bucket/syodep.json > bucket/syodep.json.tmp
          mv bucket/syodep.json.tmp bucket/syodep.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/syodep.json
          git commit -m "Scoop: bump manifest to ${GITHUB_REF_NAME}"
          git push origin HEAD:main

  publish-continuous:
    name: Publish continuous prerelease
    # Only main pushes update the rolling prerelease. Tag pushes use
    # publish-release above; manual dispatches stop at workflow artifacts.
    if: github.ref == 'refs/heads/main'
    needs: [release-build-windows, release-build-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-continuous
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check latest main commit
        id: freshness
        run: |
          git fetch origin main --depth=1
          LATEST_MAIN="$(git rev-parse origin/main)"
          if [ "$GITHUB_SHA" = "$LATEST_MAIN" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale continuous release for $GITHUB_SHA; latest main is $LATEST_MAIN."
          fi
      - uses: actions/download-artifact@v4
        if: steps.freshness.outputs.publish == 'true'
        with:
          name: syodep-win64
      - uses: actions/download-artifact@v4
        if: steps.freshness.outputs.publish == 'true'
        with:
          name: syodep-x86_64-appimage
      - name: Update rolling continuous release
        if: steps.freshness.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv syodep-win64.zip syodep-continuous-win64.zip
          mv syodep-x86_64.AppImage syodep-continuous-x86_64.AppImage

          BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo "Rolling build from main."
            echo
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Workflow run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Built at: ${BUILT_AT}"
          } > continuous-notes.md

          git tag -f continuous "${GITHUB_SHA}"
          git push origin refs/tags/continuous --force

          if gh release view continuous --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit continuous \
              --repo "${GITHUB_REPOSITORY}" \
              --title "syodep continuous" \
              --notes-file continuous-notes.md \
              --prerelease
          else
            gh release create continuous \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "syodep continuous" \
              --notes-file continuous-notes.md \
              --prerelease
          fi

          RELEASE_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/continuous" --jq .id)"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -f make_latest=false \
            --silent

          gh release upload continuous \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber \
            syodep-continuous-win64.zip \
            syodep-continuous-x86_64.AppImage
