# Release pipeline.
#
# Final shape (documented in docs/packaging.md):
#   - tag push `v*` triggers a versioned release
#   - push to `main` updates the rolling `continuous` prerelease
#   - Linux: build in an ubuntu:24.04 container (glibc 2.39 floor) with
#     distro Qt, bundle as AppImage via the reusable AppImage workflow
#   - Windows: build with aqtinstall Qt, produce a portable zip
#     plus an NSIS installer (implemented below)
#   - tag pushes publish the artifacts to a GitHub release (implemented);
#     workflow_dispatch runs only build and upload workflow artifacts

name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release-build-linux:
    name: Release build (Linux AppImage)
    # Pure builder: the publisher that used to live inside it is now
    # publish-continuous-linux below, so this call needs no write access.
    permissions:
      contents: read
    uses: ./.github/workflows/appimage.yml
    with:
      build_channel: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'continuous' || 'development') }}

  release-build-windows:
    name: Release build (Windows portable zip)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # CMake drives cargo from the repo root with no --target-dir override, so
      # the workspace `target/` this caches is the one the build actually uses.
      # Workspace crates stay uncached so the git-derived build identity is
      # always recompiled; the win is vendored MuPDF and the dependency graph.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-windows-2022
          cache-workspace-crates: "false"
          cache-on-failure: "false"
          cache-bin: "false"
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.3"
          arch: win64_msvc2019_64
          cache: true
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build (release)
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $channel = 'release'
          } elseif ($env:GITHUB_EVENT_NAME -eq 'push' -and
                    $env:GITHUB_REF -eq 'refs/heads/main') {
            $channel = 'continuous'
          } else {
            $channel = 'development'
          }
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            "-DSYODEP_BUILD_CHANNEL=$channel"
          cmake --build build
      - name: Stage portable tree (windeployqt)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path syodep-win64 | Out-Null
          Copy-Item build/ui-qt/syodep.exe syodep-win64/
          windeployqt --release --no-translations syodep-win64/syodep.exe
          Copy-Item LICENSE, README.md syodep-win64/
          Copy-Item config/default-config.toml syodep-win64/
          # Generated by the Qt build from packaging/syodep.svg. Shipped so
          # shortcuts have something to point at; the exe embeds it too.
          Copy-Item build/ui-qt/syodep.ico syodep-win64/
      # A failed SVG render still yields a structurally valid .ico, so check
      # the frames exist and the largest one is not blank.
      - name: Verify the generated icon
        shell: pwsh
        run: |
          $frames = @(magick identify syodep-win64/syodep.ico).Count
          if ($frames -lt 7) { throw "syodep.ico has $frames frames, expected 7" }
          $sd = magick syodep-win64/syodep.ico[0] -format "%[fx:standard_deviation]" info:
          if ([double]$sd -lt 0.05) { throw "syodep.ico looks blank (sd=$sd)" }
          Write-Host "syodep.ico: $frames frames, sd=$sd"
      # Run the smoke test from the staged tree with Qt stripped from PATH,
      # so a missing bundled DLL fails here instead of on a user's machine.
      # GUI-subsystem exe: judged by exit code only.
      - name: Smoke test staged binary
        shell: pwsh
        run: |
          cargo run -p syodep-pdf --features test-support `
            --example make_fixture -- fixture.pdf 5
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notlike '*Qt*' }) -join ';'
          $env:QT_QPA_PLATFORM = "offscreen"
          $exe = (Resolve-Path "syodep-win64/syodep.exe").Path
          $pdf = (Resolve-Path "fixture.pdf").Path
          $proc = Start-Process -FilePath $exe `
            -ArgumentList "--smoke-test", $pdf `
            -WorkingDirectory (Get-Location).Path -PassThru -Wait
          if ($proc.ExitCode -ne 0) {
            if (Test-Path smoke-progress.txt) {
              Write-Host "--- smoke-progress.txt ---"
              Get-Content smoke-progress.txt
            }
            Write-Error "staged smoke test failed with exit code $($proc.ExitCode)"
            exit 1
          }
      - name: Zip portable tree
        shell: pwsh
        run: Compress-Archive -Path syodep-win64 -DestinationPath syodep-win64.zip
      # NSIS 3.10 is preinstalled on windows-2022. The script is already
      # syntax-checked on Linux by the CI lint job; this builds it for real
      # over the tree the smoke test above just validated.
      - name: Build installer (NSIS)
        shell: pwsh
        run: |
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $ver = (Get-Content build/syodep-version.txt -Raw).Trim()
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            # A tag that disagrees with Cargo.toml would ship an installer and a
            # Scoop manifest asserting a version the binary does not report.
            $tagVersion = $env:GITHUB_REF_NAME -replace '^v',''
            if ($tagVersion -ne $cargo -or $ver -ne $cargo) {
              throw "tag $env:GITHUB_REF_NAME does not match Cargo.toml version $cargo"
            }
          }
          # VIProductVersion accepts exactly four numeric components.
          $vernum = (($cargo -split '[-+]')[0]) + '.0'
          Write-Host "building installer for $ver ($vernum)"
          # NSIS's license control expects CRLF; convert a build-only copy so
          # the staged LICENSE (and the zip's hash) stay untouched.
          (Get-Content LICENSE -Raw) -replace "`r?`n", "`r`n" |
            Set-Content -NoNewline license-crlf.txt
          # Every path handed to makensis must be absolute: NSIS resolves
          # relative paths against the *script's* directory, so -DSRCDIR=x
          # would be looked up under packaging/x.
          makensis -WX -V3 "-DVERSION=$ver" "-DVERSION_NUMERIC=$vernum" `
            "-DSRCDIR=$PWD\syodep-win64" "-DLICENSE_FILE=$PWD\license-crlf.txt" `
            "-DOUTFILE=$PWD\syodep-setup.exe" packaging\syodep.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed" }
          "SYODEP_INSTALLER_VERSION=$ver" | Out-File -Append $env:GITHUB_ENV
      # Install it, run the installed binary, uninstall it. Anything less is a
      # compile check, not a gate.
      - name: Verify the installer end to end
        shell: pwsh
        run: |
          $dst = "$env:LOCALAPPDATA\Programs\syodep-citest"
          $fixture = "$PWD\fixture.pdf"

          # --- silent install; /D= must be last, unquoted, no trailing slash
          # -ArgumentList must be ONE string. Given an array, PowerShell may
          # quote elements, and a quoted /D= is silently discarded by NSIS --
          # the installer then uses its default directory, which is writable,
          # so a "must fail" test passes against the wrong target entirely.
          $p = Start-Process .\syodep-setup.exe -ArgumentList "/S /D=$dst" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "silent install exited $($p.ExitCode)" }
          foreach ($f in "syodep.exe","Uninstall.exe","syodep.ico","LICENSE") {
            if (-not (Test-Path "$dst\$f")) { throw "installed tree is missing $f" }
          }
          if (-not (Test-Path "$dst\platforms\qwindows.dll")) { throw "no Qt platform plugin" }

          # --- Add/Remove Programs entry
          $k = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\syodep"
          $arp = Get-ItemProperty $k -ErrorAction Stop
          if ($arp.DisplayVersion -ne $env:SYODEP_INSTALLER_VERSION) {
            throw "DisplayVersion=$($arp.DisplayVersion), expected $env:SYODEP_INSTALLER_VERSION"
          }
          if (-not $arp.QuietUninstallString) { throw "QuietUninstallString missing" }
          # KiB, not bytes: a unit slip here reports ~1.5 GB for a 60 MB app.
          if ($arp.EstimatedSize -lt 20000 -or $arp.EstimatedSize -gt 500000) {
            throw "EstimatedSize $($arp.EstimatedSize) KiB is implausible"
          }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\syodep.lnk")) {
            throw "Start-menu shortcut missing"
          }

          # --- "Open with" is unconditional; the association is opt-in and
          #     must NOT have happened under a plain /S.
          if (-not (Test-Path "HKCU:\Software\Classes\Applications\syodep.exe\shell\open\command")) {
            throw "Open-With registration missing"
          }
          $owp = Get-ItemProperty "HKCU:\Software\Classes\.pdf\OpenWithProgids" -ErrorAction SilentlyContinue
          if ($owp -and $owp.PSObject.Properties.Name -contains 'syodep.pdf') {
            throw "/S associated .pdf without /ASSOCIATE"
          }

          # --- run what was installed, with Qt stripped from PATH
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notlike '*Qt*' }) -join ';'
          $env:QT_QPA_PLATFORM = 'offscreen'
          $p = Start-Process "$dst\syodep.exe" -ArgumentList "--smoke-test",$fixture -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installed binary smoke test exited $($p.ExitCode)" }

          # --- user data must survive uninstall. --smoke-test runs without
          #     persistence, so plant a sentinel or this assertion is vacuous.
          New-Item -ItemType Directory -Force "$env:APPDATA\syodep" | Out-Null
          Set-Content "$env:APPDATA\syodep\sentinel.txt" "keep me"

          # --- _?= keeps the uninstaller in place instead of relaunching from
          #     %TEMP% and returning immediately, which would race every
          #     assertion below. It must be the last argument.
          $p = Start-Process "$dst\Uninstall.exe" -ArgumentList "/S _?=$dst" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "silent uninstall exited $($p.ExitCode)" }
          if (Test-Path "$dst\syodep.exe") { throw "payload survived uninstall" }
          if (Test-Path "$dst\platforms") { throw "Qt plugins survived uninstall" }
          if (Test-Path $k) { throw "ARP key survived uninstall" }
          if (Test-Path "HKCU:\Software\Classes\Applications\syodep.exe") {
            throw "Open-With registration survived uninstall"
          }
          if (-not (Test-Path "$env:APPDATA\syodep\sentinel.txt")) {
            throw "uninstall deleted user data it does not own"
          }
          Remove-Item -Recurse -Force $dst -ErrorAction SilentlyContinue

          # --- opt-in association really opts in
          $p = Start-Process .\syodep-setup.exe -ArgumentList "/S /ASSOCIATE /D=$dst" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "install with /ASSOCIATE exited $($p.ExitCode)" }
          $owp = Get-ItemProperty "HKCU:\Software\Classes\.pdf\OpenWithProgids"
          if ($owp.PSObject.Properties.Name -notcontains 'syodep.pdf') {
            throw "/ASSOCIATE did not register the ProgID"
          }
          Start-Process "$dst\Uninstall.exe" -ArgumentList "/S _?=$dst" -Wait
          Remove-Item -Recurse -Force $dst -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$env:APPDATA\syodep" -ErrorAction SilentlyContinue

          # No negative test for a failed install. The obvious way to force
          # one -- /D= at an unwritable path -- cannot work: NSIS validates
          # /D= and silently falls back to InstallDir when the path is
          # unusable, so the installer simply installs to its default location
          # and correctly exits 0. Verified by logging ${GetParameters} and
          # $INSTDIR from .onInit on the runner. CheckWritable therefore
          # remains unexercised by CI; it is reached only through a directory
          # the user chooses interactively.
      # The continuous publisher consumes only the portable zip. Keep building
      # and exercising NSIS on main, but do not retain that duplicate installer
      # after its tests pass; tagged releases publish it permanently and manual
      # runs intentionally leave it downloadable for inspection.
      - name: Upload continuous Windows transfer artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: syodep-win64
          path: syodep-win64.zip
          if-no-files-found: error
          retention-days: 3
      - name: Upload release or development Windows artifact
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: syodep-win64
          path: |
            syodep-win64.zip
            syodep-setup.exe
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish GitHub release
    # Only tag pushes publish; manual dispatches stop at workflow artifacts.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-build-windows, release-build-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # main, not the tag: the Scoop manifest bump below is committed there.
      # Full history because that bump rebases when main moves under it, and
      # the default depth-1 clone has no merge base to rebase onto.
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: syodep-win64
      - uses: actions/download-artifact@v4
        with:
          name: syodep-x86_64-appimage
      - name: Create release with versioned assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv syodep-win64.zip "syodep-${GITHUB_REF_NAME}-win64.zip"
          mv syodep-setup.exe "syodep-${GITHUB_REF_NAME}-win64-setup.exe"
          mv syodep-x86_64.AppImage "syodep-${GITHUB_REF_NAME}-x86_64.AppImage"
          gh release create "$GITHUB_REF_NAME" \
            "syodep-${GITHUB_REF_NAME}-win64.zip" \
            "syodep-${GITHUB_REF_NAME}-win64-setup.exe" \
            "syodep-${GITHUB_REF_NAME}-x86_64.AppImage" \
            --repo "$GITHUB_REPOSITORY" \
            --title "syodep $GITHUB_REF_NAME" \
            --generate-notes
      # Keep `scoop install/update syodep` pointing at the new asset.
      - name: Bump Scoop manifest
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          HASH=$(sha256sum "syodep-${GITHUB_REF_NAME}-win64.zip" | cut -d' ' -f1)
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/syodep-${GITHUB_REF_NAME}-win64.zip"
          jq --indent 4 --arg v "$VERSION" --arg h "$HASH" --arg u "$URL" \
            '.version = $v
             | .architecture."64bit".url = $u
             | .architecture."64bit".hash = $h' \
            bucket/syodep.json > bucket/syodep.json.tmp
          mv bucket/syodep.json.tmp bucket/syodep.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/syodep.json
          # [skip ci]: CI's own manifest commits never trigger CI. Here that
          # only saves a full Linux + Windows + installer rebuild of a
          # one-line JSON change; in publish-continuous-windows the same
          # marker is what stops that job from re-triggering itself forever.
          # Both carry it so the rule is uniform instead of per-job reasoning.
          git commit -m "Scoop: bump manifest to ${GITHUB_REF_NAME} [skip ci]"
          # main can move between this job's checkout and its push. Rebasing
          # is safe: nothing else edits this file, and its contents describe
          # the tag's release assets, not the state of the tree it lands on.
          # Unlike the continuous bump there is no later run to repair a lost
          # push -- a dropped bump leaves `scoop install syodep` on the
          # previous release until someone notices -- so it retries rather
          # than failing on the first rejection.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main moved, rebasing the manifest bump (attempt ${attempt})"
            git fetch origin main
            git rebase origin/main
          done
          echo "could not push the Scoop manifest bump" >&2
          exit 1

  publish-continuous-linux:
    name: Publish continuous prerelease (Linux)
    # The AppImage half of the rolling release. `needs` names only the Linux
    # build, so the AppImage goes out as soon as that finishes instead of
    # waiting on the ~8-minute Windows job.
    #
    # A sibling of the Windows publisher rather than something it depends on.
    # When this job lived inside the reusable AppImage workflow, a failure here
    # failed the caller's release-build-linux job and took the whole continuous
    # release with it -- observed on a15d15f. Neither half may be able to block
    # the other.
    #
    # The event check is load-bearing, not decoration. Both build jobs pick
    # their channel on event *and* ref, so a workflow_dispatch on main builds
    # `development` binaries; gating this job on the ref alone would publish
    # those as `continuous` -- a release whose binaries report `-dev+sha`.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: release-build-linux
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # A group of its own. Sharing one with the Windows publisher would have the
    # two cancelling each other, since both carry cancel-in-progress.
    concurrency:
      group: release-continuous-linux
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check latest main commit
        id: freshness
        run: |
          git fetch origin main --depth=1
          latest_main="$(git rev-parse origin/main)"
          if [ "$GITHUB_SHA" = "$latest_main" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale continuous AppImage for $GITHUB_SHA; latest main is $latest_main."
          fi
      - uses: actions/download-artifact@v4
        if: steps.freshness.outputs.publish == 'true'
        with:
          name: syodep-x86_64-appimage
      - name: Publish the AppImage
        if: steps.freshness.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv syodep-x86_64.AppImage syodep-continuous-x86_64.AppImage
          scripts/ensure-continuous-release.sh
          gh release upload continuous \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            syodep-continuous-x86_64.AppImage

  publish-continuous-windows:
    name: Publish continuous prerelease (Windows)
    # The zip half of the rolling release, plus the Scoop manifest that points
    # at it. `needs` names only the Windows build; the AppImage published by
    # publish-continuous-linux has usually been live for several minutes by the
    # time this runs, so the two assets can legitimately be from different
    # commits. The release notes say so.
    #
    # Only main pushes update the rolling prerelease. Tag pushes use
    # publish-release above; manual dispatches stop at workflow artifacts.
    #
    # The event check is load-bearing, not decoration. Both build jobs pick
    # their channel on event *and* ref, so a workflow_dispatch on main builds
    # `development` binaries; gating this job on the ref alone would publish
    # those as `continuous` -- a release whose binaries report `-dev+sha` --
    # and now point the Scoop manifest at them too.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: release-build-windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-continuous-windows
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check latest main commit
        id: freshness
        run: |
          git fetch origin main --depth=1
          LATEST_MAIN="$(git rev-parse origin/main)"
          if [ "$GITHUB_SHA" = "$LATEST_MAIN" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale continuous Windows zip for $GITHUB_SHA; latest main is $LATEST_MAIN."
          fi
      - uses: actions/download-artifact@v4
        if: steps.freshness.outputs.publish == 'true'
        with:
          name: syodep-win64
      - name: Publish the Windows zip
        if: steps.freshness.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv syodep-win64.zip syodep-continuous-win64.zip
          scripts/ensure-continuous-release.sh
          gh release upload continuous \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber \
            syodep-continuous-win64.zip
      # Keep `scoop install/update syodep-continuous` pointing at the asset
      # that was just clobbered in place. Only the hash actually moves -- the
      # download URL is fixed -- and Scoop re-downloads solely on a version
      # change, so the version has to carry the build identity.
      #
      # Shape is `<base>-continuous.<YYYYMMDD>.<HHMMSS>+<sha12>`: the date and
      # time are separate components because Scoop compares numeric version
      # parts as 32-bit integers, and a single YYYYMMDDHHMMSS stamp overflows
      # that. Splitting them keeps both parts comparable and the ordering
      # monotonic. The commit goes in SemVer build metadata, which Scoop may
      # ignore when comparing -- that is fine, the timestamp already
      # guarantees every build differs from the last.
      - name: Bump continuous Scoop manifest
        if: steps.freshness.outputs.publish == 'true'
        run: |
          BASE="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          VERSION="${BASE}-continuous.$(date -u +%Y%m%d.%H%M%S)+${GITHUB_SHA:0:12}"
          HASH=$(sha256sum syodep-continuous-win64.zip | cut -d' ' -f1)
          jq --indent 4 --arg v "$VERSION" --arg h "$HASH" \
            '.version = $v
             | .architecture."64bit".hash = $h' \
            bucket/syodep-continuous.json > bucket/syodep-continuous.json.tmp
          mv bucket/syodep-continuous.json.tmp bucket/syodep-continuous.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/syodep-continuous.json
          # [skip ci] is load-bearing here rather than economical: this push
          # lands on main, and a main push is exactly what triggers this job,
          # so without the marker it would publish, bump and push again,
          # forever. publish-release marks its bump for the same rule, but
          # there it only saves a redundant build.
          git commit -m "Scoop: bump continuous manifest to ${GITHUB_SHA:0:12} [skip ci]"
          # main can move between the freshness check above and this push. The
          # bump touches one file nobody edits by hand, so rebasing onto the
          # newer main is always a clean no-op merge; a newer commit gets its
          # own run and overwrites this manifest anyway.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main moved, rebasing the manifest bump (attempt ${attempt})"
            git fetch origin main
            git rebase origin/main
          done
          echo "could not push the continuous manifest bump" >&2
          exit 1
