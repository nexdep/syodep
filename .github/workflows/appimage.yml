name: AppImage Preview

on:
  workflow_call:
    inputs:
      release_call:
        description: "True when release.yml invokes the shared builder"
        required: false
        type: boolean
        default: false
  workflow_dispatch:
  # Main also calls this builder through release.yml. Run a second, independent
  # preview there so a downloadable AppImage is available as soon as Linux
  # finishes instead of waiting for the Windows release job. Restrict this to
  # branches: tagged releases use only release.yml's builder.
  push:
    branches:
      - "**"
    paths:
      - "crates/**"
      - "ui-qt/**"
      - "packaging/**"
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-appimage:
    name: Build and validate Linux AppImage
    runs-on: ubuntu-24.04
    # Old userland on purpose: the AppImage inherits the build machine's
    # glibc floor (22.04 = 2.35), so it runs on Ubuntu 22.04+, Debian 12+,
    # Fedora 36+ etc. Qt comes from the container's apt and gets bundled.
    container: ubuntu:22.04
    steps:
      - uses: actions/checkout@v5
      # `unzip` is needed by MuPDF's build: its Makefile runs
      # docx_template_build.py when python3 is present (skipping it only when
      # python3 is *missing*), and that script shells out to unzip to unpack an
      # ODT template. python3 is not requested here but arrives transitively
      # through the recommends chain of these packages, so the unzip dependency
      # is invisible until it fires. Pull it in explicitly rather than relying
      # on apt recommends staying as they are.
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential clang libclang-dev cmake ninja-build \
            qt6-base-dev libqt6opengl6-dev qt6-wayland libgl1-mesa-dev \
            libfontconfig1-dev libfreetype-dev \
            curl file ca-certificates unzip weston
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      # Keep the final workspace crates out of the cache so git-derived build
      # identity is always regenerated, while retaining expensive dependency
      # and native-library compilation (notably vendored MuPDF).
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: appimage-ubuntu-22.04
          cache-workspace-crates: "false"
          cache-on-failure: "false"
          cache-bin: "false"
      - name: Build (release)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      # Populate the AppDir first, then remove every non-Wayland QPA before a
      # second linuxdeploy pass creates the AppImage. System-integration libs
      # (glibc, libGL, fontconfig) stay on linuxdeploy's exclude list and
      # resolve from the host. --appimage-extract-and-run is set because the
      # build container has no FUSE.
      - name: Package AppImage (linuxdeploy)
        run: |
          curl -fsSLO https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSLO https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage
          export EXTRA_PLATFORM_PLUGINS="libqwayland-egl.so;libqwayland-generic.so"
          export QMAKE=/usr/bin/qmake6
          export APPIMAGE_EXTRACT_AND_RUN=1
          export OUTPUT="syodep-x86_64.AppImage"
          # EXTRA_PLATFORM_PLUGINS deploys the Wayland QPA plugin but not the
          # client buffer integration it loads at runtime. Seed that exact Qt
          # plugin into the AppDir before linuxdeploy packages it.
          qt_plugins_dir="$("$QMAKE" -query QT_INSTALL_PLUGINS)"
          wayland_egl_rel="wayland-graphics-integration-client/libqt-plugin-wayland-egl.so"
          test -f "$qt_plugins_dir/$wayland_egl_rel"
          install -D -m 0755 "$qt_plugins_dir/$wayland_egl_rel" \
            "AppDir/usr/plugins/$wayland_egl_rel"
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --executable build/ui-qt/syodep \
            --desktop-file packaging/syodep.desktop \
            --icon-file packaging/syodep.svg \
            --plugin qt
          platform_dir="$(find AppDir -type d -path '*/plugins/platforms' -print -quit)"
          test -n "$platform_dir"
          find "$platform_dir" -mindepth 1 -maxdepth 1 \
            ! -name 'libqwayland-egl.so' \
            ! -name 'libqwayland-generic.so' -delete
          test -f "$platform_dir/libqwayland-egl.so"
          test -f "$platform_dir/libqwayland-generic.so"
          test ! -e "$platform_dir/libqxcb.so"
          test ! -e "$platform_dir/libqoffscreen.so"
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --output appimage
      - name: Verify bundled Qt platform plugins
        run: |
          chmod +x syodep-x86_64.AppImage
          ./syodep-x86_64.AppImage --appimage-extract
          platform_dir="$(find squashfs-root -type d -path '*/plugins/platforms' -print -quit)"
          test -n "$platform_dir"
          test -f "$platform_dir/libqwayland-egl.so"
          test -f "$platform_dir/libqwayland-generic.so"
          test ! -e "$platform_dir/libqxcb.so"
          test ! -e "$platform_dir/libqoffscreen.so"
          plugin_root="$(dirname "$platform_dir")"
          wayland_egl="$plugin_root/wayland-graphics-integration-client/libqt-plugin-wayland-egl.so"
          test -f "$wayland_egl"
          wayland_client_lib="$(find squashfs-root -name 'libQt6WaylandEglClientHwIntegration.so.6' -print -quit)"
          test -n "$wayland_client_lib"
          LD_LIBRARY_PATH="$(dirname "$wayland_client_lib")" ldd "$wayland_egl" \
            > wayland-egl-ldd.txt
          cat wayland-egl-ldd.txt
          if grep -q 'not found' wayland-egl-ldd.txt; then
            echo "Wayland EGL client integration has unresolved dependencies" >&2
            exit 1
          fi
      # Run the actual AppImage so a missing bundled lib fails here, not on a
      # user's machine. Both presentation backends use the shipped Wayland QPA.
      - name: Smoke test the AppImage (Wayland OpenGL + raster)
        run: |
          cargo run -p syodep-pdf --features test-support \
            --example make_fixture -- fixture.pdf 5
          chmod +x syodep-x86_64.AppImage
          bash scripts/with-headless-wayland.sh bash -euo pipefail -c '
            ./syodep-x86_64.AppImage --appimage-extract-and-run \
              --renderer=opengl --smoke-test fixture.pdf
            ./syodep-x86_64.AppImage --appimage-extract-and-run \
              --renderer=raster --smoke-test fixture.pdf
            ./syodep-x86_64.AppImage --appimage-extract-and-run \
              --renderer=auto --check | grep -q "Selected:         opengl"
            if QT_QPA_PLATFORM=xcb ./syodep-x86_64.AppImage \
                --appimage-extract-and-run --check; then
              echo "XCB override was not rejected" >&2
              exit 1
            fi
          ' || { echo '--- smoke-progress.txt ---'; cat smoke-progress.txt 2>/dev/null || true; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: syodep-x86_64-appimage
          path: syodep-x86_64.AppImage
          if-no-files-found: error
          retention-days: 14

  publish-appimage-preview:
    name: Publish raw AppImage preview
    # Direct main pushes publish a raw release asset. release.yml passes
    # release_call=true, so its reuse of this builder never races this job.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !inputs.release_call
    needs: build-appimage
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: appimage-preview
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check latest main commit
        id: freshness
        run: |
          git fetch origin main --depth=1
          latest_main="$(git rev-parse origin/main)"
          if [ "$GITHUB_SHA" = "$latest_main" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale AppImage preview for $GITHUB_SHA; latest main is $latest_main."
          fi
      - uses: actions/download-artifact@v4
        if: steps.freshness.outputs.publish == 'true'
        with:
          name: syodep-x86_64-appimage
      - name: Update raw AppImage prerelease
        if: steps.freshness.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="syodep-appimage-preview-x86_64.AppImage"
          mv syodep-x86_64.AppImage "$asset"

          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo "Fast Linux AppImage preview from main."
            echo
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Workflow run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Built at: ${built_at}"
          } > appimage-preview-notes.md

          git tag -f appimage-preview "$GITHUB_SHA"
          git push origin refs/tags/appimage-preview --force

          if gh release view appimage-preview --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit appimage-preview \
              --repo "$GITHUB_REPOSITORY" \
              --title "syodep AppImage preview" \
              --notes-file appimage-preview-notes.md \
              --prerelease
          else
            gh release create appimage-preview \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "syodep AppImage preview" \
              --notes-file appimage-preview-notes.md \
              --prerelease
          fi

          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/appimage-preview" --jq .id)"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            -f make_latest=false \
            --silent

          gh release upload appimage-preview \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            "$asset"
