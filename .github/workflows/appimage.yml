name: AppImage Build

on:
  workflow_call:
    inputs:
      build_channel:
        description: "Version identity channel: release, continuous, or development"
        required: false
        type: string
        default: development
  workflow_dispatch:
  # Feature branches only. main reaches this builder through release.yml, which
  # publishes the AppImage from that same build; a standalone run here would
  # rebuild a byte-identical AppImage for nothing. That publisher waits on this
  # Linux build alone, so routing main through release.yml costs no latency.
  push:
    branches:
      - "**"
      - "!main"
    paths:
      - "crates/**"
      - "ui-qt/**"
      - "packaging/**"
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-appimage:
    name: Build and validate Linux AppImage
    runs-on: ubuntu-24.04
    # The AppImage inherits the build userland's glibc floor. Ubuntu 24.04
    # supplies glibc 2.39, so the package targets Ubuntu 24.04+ and other
    # Wayland distributions with glibc >= 2.39. Distro Qt is bundled.
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v5
      # `unzip` is needed by MuPDF's build: its Makefile runs
      # docx_template_build.py when python3 is present (skipping it only when
      # python3 is *missing*), and that script shells out to unzip to unpack an
      # ODT template. python3 is not requested here but arrives transitively
      # through the recommends chain of these packages, so the unzip dependency
      # is invisible until it fires. Pull it in explicitly rather than relying
      # on apt recommends staying as they are.
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential clang libclang-dev cmake ninja-build \
            qt6-base-dev libqt6opengl6-dev qt6-wayland libgl1-mesa-dev \
            libfontconfig1-dev libfreetype-dev \
            curl file ca-certificates git unzip patchelf weston
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      # Keep the final workspace crates out of the cache so git-derived build
      # identity is always regenerated, while retaining expensive dependency
      # and native-library compilation (notably vendored MuPDF).
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: appimage-ubuntu-24.04
          cache-workspace-crates: "false"
          cache-on-failure: "false"
          cache-bin: "false"
      - name: Build (release)
        env:
          BUILD_CHANNEL: ${{ inputs.build_channel || 'development' }}
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSYODEP_BUILD_CHANNEL="$BUILD_CHANNEL"
          cmake --build build
      # Populate the AppDir first, then remove every non-Wayland QPA before a
      # second linuxdeploy pass creates the AppImage. System-integration libs
      # (glibc, libGL, fontconfig, xkbcommon) stay on linuxdeploy's exclude
      # list and resolve from the host. --appimage-extract-and-run is set
      # because the build container has no FUSE.
      - name: Package AppImage (linuxdeploy)
        run: |
          curl -fsSLO https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSLO https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage
          export EXTRA_PLATFORM_PLUGINS="libqwayland-egl.so;libqwayland-generic.so"
          export QMAKE=/usr/bin/qmake6
          export APPIMAGE_EXTRACT_AND_RUN=1
          export OUTPUT="syodep-x86_64.AppImage"
          # EXTRA_PLATFORM_PLUGINS deploys the Wayland QPA plugin but not the
          # client buffer integration it loads at runtime. Seed that exact Qt
          # plugin into the AppDir before linuxdeploy packages it.
          qt_plugins_dir="$("$QMAKE" -query QT_INSTALL_PLUGINS)"
          wayland_egl_rel="wayland-graphics-integration-client/libqt-plugin-wayland-egl.so"
          test -f "$qt_plugins_dir/$wayland_egl_rel"
          install -D -m 0755 "$qt_plugins_dir/$wayland_egl_rel" \
            "AppDir/usr/plugins/$wayland_egl_rel"
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --executable build/ui-qt/syodep \
            --desktop-file packaging/syodep.desktop \
            --icon-file packaging/syodep.svg \
            --exclude-library 'libxkbcommon.so*' \
            --exclude-library 'libxkbcommon-x11.so*' \
            --plugin qt
          platform_dir="$(find AppDir -type d -path '*/plugins/platforms' -print -quit)"
          test -n "$platform_dir"
          find "$platform_dir" -mindepth 1 -maxdepth 1 \
            ! -name 'libqwayland-egl.so' \
            ! -name 'libqwayland-generic.so' -delete
          test -f "$platform_dir/libqwayland-egl.so"
          test -f "$platform_dir/libqwayland-generic.so"
          test ! -e "$platform_dir/libqxcb.so"
          test ! -e "$platform_dir/libqoffscreen.so"
          # Compose tables are host data. Keep the xkbcommon parser on the
          # host as well so a newer table is never parsed by an older bundled
          # library. The explicit deletion also covers libraries copied by
          # the Qt deployment plugin before linuxdeploy applies exclusions.
          find AppDir \( -type f -o -type l \) \
            \( -name 'libxkbcommon.so*' -o -name 'libxkbcommon-x11.so*' \) \
            -delete
          # linuxdeploy calculates this nested, manually-seeded plugin's
          # RUNPATH from the AppDir root instead of usr/lib. Correct it after
          # deployment, then prove the dependency resolves from the bundle.
          wayland_egl="AppDir/usr/plugins/$wayland_egl_rel"
          patchelf --set-rpath '$ORIGIN/../../lib:$ORIGIN' "$wayland_egl"
          scripts/check-appimage-wayland-egl.sh AppDir
          scripts/check-appimage-host-libraries.sh AppDir
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --exclude-library 'libxkbcommon.so*' \
            --exclude-library 'libxkbcommon-x11.so*' \
            --output appimage
      - name: Verify bundled Qt platform plugins
        run: |
          chmod +x syodep-x86_64.AppImage
          ./syodep-x86_64.AppImage --appimage-extract
          platform_dir="$(find squashfs-root -type d -path '*/plugins/platforms' -print -quit)"
          test -n "$platform_dir"
          test -f "$platform_dir/libqwayland-egl.so"
          test -f "$platform_dir/libqwayland-generic.so"
          test ! -e "$platform_dir/libqxcb.so"
          test ! -e "$platform_dir/libqoffscreen.so"
          scripts/check-appimage-wayland-egl.sh squashfs-root
          scripts/check-appimage-host-libraries.sh squashfs-root
      # Run the actual AppImage so a missing bundled lib fails here, not on a
      # user's machine. Both presentation backends use the shipped Wayland QPA.
      - name: Smoke test the AppImage (Wayland OpenGL + raster)
        run: |
          cargo run -p syodep-pdf --features test-support \
            --example make_fixture -- fixture.pdf 5
          chmod +x syodep-x86_64.AppImage
          export SYODEP_EXPECTED_BUILD_VERSION="$(tr -d '\r\n' < build/syodep-version.txt)"
          bash scripts/with-headless-wayland.sh bash -euo pipefail -c '
            ./syodep-x86_64.AppImage --appimage-extract-and-run \
              --renderer=opengl --smoke-test fixture.pdf
            ./syodep-x86_64.AppImage --appimage-extract-and-run \
              --renderer=raster --smoke-test fixture.pdf
            check_report="$(./syodep-x86_64.AppImage --appimage-extract-and-run \
              --renderer=auto --check)"
            grep -q "Selected:         opengl" <<<"$check_report"
            grep -Fqx "  syodep (shell):   $SYODEP_EXPECTED_BUILD_VERSION" \
              <<<"$check_report"
            grep -Fqx "  syodep (core):    $SYODEP_EXPECTED_BUILD_VERSION" \
              <<<"$check_report"
            if QT_QPA_PLATFORM=xcb ./syodep-x86_64.AppImage \
                --appimage-extract-and-run --check; then
              echo "XCB override was not rejected" >&2
              exit 1
            fi
          ' || { echo '--- smoke-progress.txt ---'; cat smoke-progress.txt 2>/dev/null || true; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: syodep-x86_64-appimage
          path: syodep-x86_64.AppImage
          if-no-files-found: error
          # On main this only transfers the package to the continuous publisher;
          # branch, tag, and manual builds remain downloadable for a week.
          retention-days: ${{ github.ref == 'refs/heads/main' && 3 || 7 }}

# The continuous publishers live in release.yml, not here. main is the only ref
# they ever publish for, and main no longer triggers this workflow directly --
# so as jobs here they would be unreachable, and as part of this workflow a
# publish failure would fail the caller's `uses:` job and take the continuous
# release down with it. In release.yml they are siblings of that build instead.
