# syodep configuration — generated by `syodep --defaults`.
#
# Every option below is set to its built-in default. Copy this file to:
#   Linux:   ~/.config/syodep/config.toml
#   Windows: %APPDATA%\syodep\config.toml
#
# Everything here is optional; deleting a value falls back to the same
# default shown. An invalid file never prevents syodep from starting: the
# error is shown in the status bar and defaults are used instead.
# See docs/config.md for the full reference.

[view]
# Pixels moved per scroll step (j / k).
scroll_step = 60.0
# Pixels moved per horizontal scroll step (h / l).
horizontal_scroll_step = 60.0
# Gap between pages, in PDF points (1/72 inch at 100% zoom).
page_gap = 12.0
# Zoom factor used when opening a document without a saved position...
default_zoom = 1.0
# ...unless this is true, in which case the page is fitted to the window width.
fit_width_on_open = true
# Multiplicative zoom step for zoom_in / zoom_out.
zoom_step = 1.1
# Canvas background color (#rrggbb).
background = "#1e1e1e"
# Highlight for focus mode. Every scope shares one colour, so the
# highlight tells you that focus is active rather than which
# granularity you are in.
focus_color = "#add8e6"
# Opacity of the focus highlight, 0.0 to 1.0.
focus_opacity = 0.4
# Highlight for the visual-mode selection (#rrggbb).
visual_color = "#d3d3d3"
# Opacity of the selection highlight, 0.0 to 1.0.
visual_opacity = 0.4

[files]
# Starting directory for the Open dialog (<C-o>). When unset, the
# dialog opens in the directory syodep was launched from. If the path below
# does not exist (or is not a directory), syodep falls back to the launch
# directory. Run `syodep --check` to see which directory is in effect.
# Use an absolute path ("~" is not expanded). Unset by default:
# open_dir = "/home/me/papers"

[input]
# How long (milliseconds) a half-typed key sequence waits before it acts
# on its own. This is what lets a key that is both a command and the
# start of a longer one -- "c", "v", or "o" while selecting -- be used
# by itself: press it, pause, and it acts. Sequences typed at normal
# speed never reach the pause. Set to 0 to switch it off, so only the
# next key press ever ends the wait.
timeout_ms = 500

# Keybindings: "key sequence" = "command". The entries below are the
# built-in defaults; in your own config you only need to list changes,
# which ADD TO or OVERRIDE these.
# Key syntax (see docs/keybindings.md): plain chars ("j", "G", "+"),
# sequences ("gg", "zw"), special keys in angle brackets ("<Esc>", "<CR>",
# "<Space>", "<Up>", "<PageDown>", ...), modifiers inside the brackets
# ("<C-d>" = ctrl+d, "<A-x>" = alt+x, "<C-A-Left>").
# Command names are listed in docs/commands.md.
[keys]
"+" = "zoom_in"
"-" = "zoom_out"
"<C-b>" = "scroll_page_up"
"<C-d>" = "scroll_half_page_down"
"<C-f>" = "scroll_page_down"
"<C-o>" = "open_file"
"<C-u>" = "scroll_half_page_up"
"<Down>" = "scroll_down"
"<Esc>" = "cancel"
"<Left>" = "scroll_left"
"<PageDown>" = "next_page"
"<PageUp>" = "prev_page"
"<Right>" = "scroll_right"
"<Up>" = "scroll_up"
"=" = "zoom_in"
"G" = "goto_last_page"
"J" = "next_page"
"K" = "prev_page"
"c" = "focus_enter"
"cc" = "focus_enter_char"
"ce" = "focus_enter_line"
"cp" = "focus_enter_paragraph"
"cs" = "focus_enter_sentence"
"cw" = "focus_enter_word"
"gg" = "goto_first_page"
"h" = "scroll_left"
"j" = "scroll_down"
"k" = "scroll_up"
"l" = "scroll_right"
"q" = "quit"
"v" = "visual_enter"
"vc" = "visual_enter_char"
"ve" = "visual_enter_line"
"vp" = "visual_enter_paragraph"
"vs" = "visual_enter_sentence"
"vw" = "visual_enter_word"
"z0" = "zoom_reset"
"zw" = "fit_width"

# Focus-mode keybindings (active after pressing "cc", "cw", "ce", "cs" or
# "cp"). These overlay the normal [keys] while focus mode is active: hjkl and
# the arrows move the highlight by one unit of the active scope, w/e/b move a
# word at a time whatever the scope, and <Esc> exits.
# One table covers every scope, because the commands dispatch on the scope:
# "focus_left" is a character in char scope, a word in word scope, a column
# jump in line scope and the previous unit in sentence/paragraph scope.
[focus_keys]
"<Down>" = "focus_down"
"<Esc>" = "focus_exit"
"<Left>" = "focus_left"
"<Right>" = "focus_right"
"<Up>" = "focus_up"
"b" = "focus_prev_word"
"e" = "focus_end_word"
"h" = "focus_left"
"j" = "focus_down"
"k" = "focus_up"
"l" = "focus_right"
"p" = "focus_next_paragraph"
"s" = "focus_next_sentence"
"w" = "focus_next_word"

# Visual-mode keybindings (active after pressing "v"). hjkl/arrows grow the
# selection by one unit of the active end's scope. "v" plus a scope letter
# changes the moving end's scope, "o" switches ends and "o" plus a scope
# letter does both. <Esc> exits to the mode visual mode was entered from.
[visual_keys]
"<Down>" = "visual_down"
"<Esc>" = "visual_exit"
"<Left>" = "visual_left"
"<Right>" = "visual_right"
"<Up>" = "visual_up"
"b" = "visual_prev_word"
"e" = "visual_end_word"
"h" = "visual_left"
"j" = "visual_down"
"k" = "visual_up"
"l" = "visual_right"
"o" = "visual_swap_ends"
"oc" = "visual_other_char"
"oe" = "visual_other_line"
"oo" = "visual_swap_ends"
"op" = "visual_other_paragraph"
"os" = "visual_other_sentence"
"ow" = "visual_other_word"
"p" = "visual_next_paragraph"
"s" = "visual_next_sentence"
"v" = "visual_exit"
"vc" = "visual_scope_char"
"ve" = "visual_scope_line"
"vp" = "visual_scope_paragraph"
"vs" = "visual_scope_sentence"
"vw" = "visual_scope_word"
"w" = "visual_next_word"
